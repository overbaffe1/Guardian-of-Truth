[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "guardian-of-truth"
version = "0.3.0"
description = "Black-box contextual hallucination detector for LLM agent trajectories"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Guardian of Truth solution" }]
dependencies = [
    "pandas>=2.0",
    "pyarrow>=12.0",
    "numpy>=1.24",
]

[project.optional-dependencies]
llm = [
    "vllm>=0.6.3",
    "transformers>=4.44",
    "accelerate>=0.30",
]
dev = [
    "pytest>=7.4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
