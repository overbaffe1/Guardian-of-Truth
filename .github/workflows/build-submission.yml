name: build-submission

# Build a complete, ready-to-upload competition archive on a GitHub-hosted
# runner: fetch the judge weights, assemble submission.zip with the documented
# layout, verify it, and publish it as Release assets.
#
# Why a runner: the development sandbox cannot reach huggingface.co, and
# release-assets.githubusercontent.com is not reachable from it either, so the
# ~10 GB of weights cannot be brought back into the sandbox. Pushing them into
# this public repository is not acceptable either. So the runner does the work
# and publishes the result.
#
# The archive is published as Release assets (< 2 GB each) rather than being
# committed: model weights must never enter the repository history. Only a
# small status report is committed, because the sandbox cannot read job logs
# either -- the outcome has to travel through the repo.
#
# The build is one step with plain bash branching on purpose. Step-level
# conditions referencing `steps.<id>.outputs` made GitHub reject the whole file
# (a zero-job run named after the path), which is very hard to diagnose from the
# outside.

on:
  repository_dispatch:
    types: [build-submission]
  workflow_dispatch:
    inputs:
      model_id:
        description: "Hugging Face model id for the judge"
        required: false
        default: "Qwen/Qwen2.5-14B-Instruct-AWQ"

permissions:
  contents: write

concurrency:
  group: build-submission-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      MODEL_ID: ${{ github.event.client_payload.model_id || inputs.model_id || 'Qwen/Qwen2.5-14B-Instruct-AWQ' }}
      REPORT_BRANCH: ${{ github.event.client_payload.report_branch || github.ref_name }}
      REPORT_PATH: reports/build-status.json
      HF_HOME: /tmp/hf_cache
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.client_payload.ref || github.ref_name }}
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install huggingface_hub pandas pyarrow

      - name: Build, verify and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          cd "$GITHUB_WORKSPACE"
          mkdir -p "$(dirname "$REPORT_PATH")"
          status() { python3 -c "import json,sys; json.dump(json.loads(sys.argv[1]), open(sys.argv[2],'w'), indent=2)" "$1" "$REPORT_PATH"; }
          fail() { status "$1"; echo "::error::$1"; exit 1; }

          df -h / | tail -1
          FREE_BEFORE=$(df -BG --output=avail / | tail -1 | tr -dc '0-9')
          echo "free before download: ${FREE_BEFORE} GB"
          status "{\"stage\":\"probe\",\"free_gb\":$FREE_BEFORE,\"model_id\":\"$MODEL_ID\"}"

          # ---- fetch the weights -------------------------------------------
          mkdir -p model
          if ! python3 - <<'PY'
          import os
          from huggingface_hub import snapshot_download
          snapshot_download(
              repo_id=os.environ["MODEL_ID"],
              local_dir="model",
              allow_patterns=["*.json", "*.safetensors", "*.txt", "*.model"],
              max_workers=4,
          )
          PY
          then
            fail '{"stage":"download_failed"}'
          fi
          # snapshot_download keeps a second copy under model/.cache and
          # HF_HOME; both would double the disk peak for no benefit.
          rm -rf model/.cache /tmp/hf_cache
          MODEL_MB=$(du -sm model | cut -f1)
          MODEL_GB=$(( MODEL_MB / 1024 + 1 ))
          FREE_AFTER=$(df -BG --output=avail / | tail -1 | tr -dc '0-9')
          echo "model: ${MODEL_MB} MB, free now: ${FREE_AFTER} GB"
          ls model

          NEED=$(( MODEL_GB + 4 ))

          # ---- not enough room for the zip: ship the weights ---------------
          if [ "$FREE_AFTER" -lt "$NEED" ]; then
            echo "not enough disk for the archive; publishing the weights instead"
            TAG="weights-$(date +%Y%m%d-%H%M)"
            rm -rf weights_parts && mkdir -p weights_parts
            for f in model/*; do
              split -b 1900M -d -a 2 "$f" "weights_parts/$(basename "$f").part."
            done
            ( cd weights_parts && sha256sum ./*.part.* > sha256.txt )
            {
              echo "# Weights for the judge: $MODEL_ID"
              echo
              echo "Reassemble the parts into model/, then build the archive:"
              echo '```bash'
              echo "python scripts/make_submission.py --model model --out submission.zip"
              echo '```'
              echo
              echo "## sha256 of the parts"
              echo '```'
              cat weights_parts/sha256.txt
              echo '```'
            } > weights_parts/README.md
            if ! gh release create "$TAG" weights_parts/*.part.* weights_parts/sha256.txt weights_parts/README.md \
                 --repo "$GITHUB_REPOSITORY" --title "Guardian of Truth weights $TAG" \
                 --notes "Judge weights for $MODEL_ID"; then
              fail "{\"stage\":\"release_failed\",\"tag\":\"$TAG\"}"
            fi
            status "{\"stage\":\"weights_only\",\"tag\":\"$TAG\",\"model_gb\":$MODEL_GB,\"free_gb\":$FREE_AFTER,\"note\":\"not enough disk for the zip; build it locally\"}"
            exit 0
          fi

          # ---- build the archive -------------------------------------------
          if ! python3 scripts/make_submission.py --model model --out submission.zip; then
            fail "{\"stage\":\"build_failed\",\"model_gb\":$MODEL_GB,\"free_gb\":$FREE_AFTER}"
          fi
          ls -lh submission.zip
          rm -rf model
          df -h / | tail -1

          # ---- verify -------------------------------------------------------
          unzip -t submission.zip | tail -2 || fail '{"stage":"zip_corrupt"}'
          for f in README.md pyproject.toml scripts/predict.py; do
            unzip -l submission.zip "$f" | grep -q "$f" || fail "{\"stage\":\"missing_entry\",\"entry\":\"$f\"}"
          done
          if unzip -l submission.zip | grep -q "metrics/"; then
            fail '{"stage":"metrics_dir_present"}'
          fi
          N=$(unzip -l submission.zip | grep -c "model/.*safetensors" || true)
          if [ "$N" -lt 1 ]; then fail '{"stage":"no_weights_in_archive"}'; fi
          echo "entries ok, weight shards: $N"
          unzip -l submission.zip | head -20

          # ---- smoke test the entrypoint the platform calls ------------------
          rm -rf /tmp/smoke && mkdir -p /tmp/smoke
          ( cd /tmp/smoke && unzip -q "$GITHUB_WORKSPACE/submission.zip" )
          if ! ( cd /tmp/smoke && python3 scripts/predict.py \
                   --input "$GITHUB_WORKSPACE/valid.parquet" --output /tmp/smoke/pred.csv ); then
            fail '{"stage":"entrypoint_failed"}'
          fi
          head -c 4 /tmp/smoke/pred.csv
          python3 - <<'PY' || fail '{"stage":"entrypoint_output_invalid"}'
          import pandas as pd
          d = pd.read_parquet("/tmp/smoke/pred.csv")
          src = pd.read_parquet("valid.parquet")
          assert list(d.columns) == ["id", "label"], d.columns
          assert len(d) == len(src), (len(d), len(src))
          assert list(d.id) == list(src.id), "ids must be unchanged"
          assert set(d.label.unique()) <= {0, 1}
          print("entrypoint OK:", len(d), "rows, positive rate", round(d.label.mean(), 3))
          PY

          # ---- publish ------------------------------------------------------
          TAG="submission-$(date +%Y%m%d-%H%M)"
          split -b 1900M -d -a 2 submission.zip submission.part.
          PARTS=$(ls submission.part.* | wc -l)
          SHA256=$(sha256sum submission.zip | cut -d' ' -f1)
          {
            echo "# Guardian of Truth: ready-to-upload archive"
            echo
            echo "\`submission.zip\` is split into ${PARTS} part(s), each under 2 GB"
            echo "(the GitHub release asset limit)."
            echo
            echo '```bash'
            echo "cat submission.part.* > submission.zip"
            echo '```'
            echo
            echo "Judge model: \`$MODEL_ID\`. Upload \`submission.zip\` afterwards."
            echo
            echo "## sha256 of the parts"
            echo '```'
            sha256sum submission.part.*
            echo '```'
          } > submission.README.md
          if ! gh release create "$TAG" submission.part.* submission.README.md \
               --repo "$GITHUB_REPOSITORY" --title "Guardian of Truth submission $TAG" \
               --notes "Built and verified on a GitHub runner."; then
            fail "{\"stage\":\"release_failed\",\"tag\":\"$TAG\"}"
          fi
          status "{\"stage\":\"published\",\"tag\":\"$TAG\",\"parts\":$PARTS,\"sha256\":\"$SHA256\",\"archive_bytes\":$(stat -c%s submission.zip),\"model_id\":\"$MODEL_ID\"}"
          echo "published: https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG"

      - name: Commit the build report
        if: always()
        run: |
          set -uo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p "$(dirname "$REPORT_PATH")"
          python3 - <<PY || true
          import json, os
          path = os.environ["REPORT_PATH"]
          data = {}
          if os.path.exists(path):
              try:
                  data = json.load(open(path))
              except Exception:
                  data = {"stage": "unparseable"}
          data["job_status"] = "${{ job.status }}"
          json.dump(data, open(path, "w"), indent=2)
          PY
          git add -f "$REPORT_PATH"
          git commit -m "build-submission: status [skip ci]" || echo "nothing to commit"
          git push origin "HEAD:${REPORT_BRANCH}" || echo "push failed"