name: remote-eval

# Fetch a dataset (or any archive) from the open internet on a GitHub-hosted
# runner and compute aggregate metrics with the Guardian of Truth package.
#
# Why: the development sandbox can only reach GitHub/PyPI, while the competition
# data lives on Sber OBS with expiring presigned links. The runner can reach it.
#
# Privacy: only *aggregate* numbers are committed (reports/<label>.json).
# Raw rows are never written into the repository and are only uploaded as an
# artifact when `store_raw` is explicitly set to true.

on:
  repository_dispatch:
    types: [remote-eval]
  # Self-test: validates the runner itself (install, download, metrics, commit)
  # without needing a URL. Runs only when the workflow or the script changes.
  push:
    paths:
      - ".github/workflows/remote-eval.yml"
      - ".github/scripts/remote_eval.py"
  workflow_dispatch:
    inputs:
      url:
        description: "Direct URL to a .parquet/.csv/.jsonl/.zip (avoid secrets: use repository_dispatch for presigned links)"
        required: true
      label:
        description: "Report tag (file name)"
        default: "dataset"
      limit:
        description: "Evaluate at most N rows (0 = all)"
        default: "0"
      store_raw:
        description: "Upload the downloaded file as an artifact (true/false)"
        default: "false"

permissions:
  contents: write

concurrency:
  group: remote-eval-${{ github.ref }}
  cancel-in-progress: false

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # repository_dispatch carries the URL in client_payload; workflow_dispatch
      # passes it as an input.
      TARGET_URL: ${{ github.event.client_payload.url || inputs.url }}
      TARGET_LABEL: ${{ github.event.client_payload.label || inputs.label || 'dataset' }}
      TARGET_LIMIT: ${{ github.event.client_payload.limit || inputs.limit || '0' }}
      STORE_RAW: ${{ github.event.client_payload.store_raw || inputs.store_raw || 'false' }}
      # Which branch holds the code to evaluate, and which branch receives the
      # aggregate report. Both default to the triggering ref but can be
      # overridden per dispatch, so a report never lands on someone else's branch.
      TARGET_REF: ${{ github.event.client_payload.ref || github.ref_name }}
      REPORT_BRANCH: ${{ github.event.client_payload.report_branch || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.client_payload.ref || github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Mask the URL and validate input
        run: |
          set -euo pipefail
          if [ -z "${TARGET_URL:-}" ]; then
            # Self-test mode: no URL supplied (push trigger). Evaluate the small
            # committed fixture so the runner path is still exercised.
            echo "::notice::No URL supplied - running the self-test on the committed fixture"
            echo "TARGET_URL=fixture" >> "$GITHUB_ENV"
            echo "TARGET_LABEL=fixture" >> "$GITHUB_ENV"
            echo "FIXTURE=$GITHUB_WORKSPACE/tests/fixtures/tau2_samples.jsonl" >> "$GITHUB_ENV"
            exit 0
          fi
          echo "::add-mask::$TARGET_URL"
          echo "label=$TARGET_LABEL limit=$TARGET_LIMIT store_raw=$STORE_RAW"

      - name: Install the package
        run: |
          python -m pip install --upgrade pip
          python -m pip install . pandas pyarrow

      - name: Download (external network)
        if: env.TARGET_URL != 'fixture'
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/download"
          RAW="$RUNNER_TEMP/download/download.bin"
          # Several links separated by "|" are concatenated into one archive
          # (split uploads of a multi-volume tar).
          IFS='|' read -ra URLS <<< "$TARGET_URL"
          : > "$RAW"
          for u in "${URLS[@]}"; do
            echo "Downloading part..."
            curl -fL --retry 5 --retry-delay 5 --retry-all-errors --connect-timeout 30 \
                 -o "$RUNNER_TEMP/download/part.bin" "$u" --progress-bar
            cat "$RUNNER_TEMP/download/part.bin" >> "$RAW"
          done
          # The presigned path is a bare UUID with no extension, so the file type
          # is decided by its magic bytes instead of by its name.
          magic=$(head -c 4 "$RAW" | od -An -tx1 | tr -d ' \n')
          case "$magic" in
            504b0304*) ext=".zip" ;;
            50415231*) ext=".parquet" ;;
            1f8b*)     ext=".tar.gz" ;;
            *)         ext=".bin" ;;
          esac
          OUT="$RUNNER_TEMP/download/data$ext"
          mv "$RAW" "$OUT"
          echo "Detected type: $ext"
          ls -lh "$OUT"
          echo "size_bytes=$(stat -c%s "$OUT")" | tee -a "$GITHUB_STEP_SUMMARY"
          file "$OUT" || true
          sha256sum "$OUT" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "DOWNLOAD_PATH=$OUT" >> "$GITHUB_ENV"

      - name: Evaluate
        run: |
          set -euo pipefail
          mkdir -p reports
          if [ "${TARGET_URL:-}" = "fixture" ]; then
            INPUT="$FIXTURE"
            TARGET_LABEL=fixture
            echo "TARGET_LABEL=fixture" >> "$GITHUB_ENV"
          else
            INPUT="$DOWNLOAD_PATH"
          fi
          python .github/scripts/remote_eval.py \
            --input "$INPUT" \
            --label "$TARGET_LABEL" \
            --limit "${TARGET_LIMIT:-0}" \
            --extract-dir "$RUNNER_TEMP/extracted" \
            --out "reports/${TARGET_LABEL}.json" | tee "$RUNNER_TEMP/report.txt"
          {
            echo "### remote-eval: $TARGET_LABEL"
            echo '```json'
            head -c 20000 "reports/${TARGET_LABEL}.json"
            echo
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit the aggregate report
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "reports/${TARGET_LABEL}.json"
          if git diff --cached --quiet; then
            echo "report unchanged"
            exit 0
          fi
          git commit -m "remote-eval: ${TARGET_LABEL} [skip ci]"
          pushed=0
          for attempt in 1 2 3; do
            if git pull --rebase --autostash origin "${REPORT_BRANCH}" && \
               git push origin "HEAD:${REPORT_BRANCH}"; then
              pushed=1
              echo "report pushed to ${REPORT_BRANCH}"
              break
            fi
            echo "push attempt $attempt failed, retrying"
            sleep 5
          done
          # Never let a lost report look like a green run.
          if [ "$pushed" != "1" ]; then
            echo "::error::could not push reports/${TARGET_LABEL}.json to ${REPORT_BRANCH}"
            exit 1
          fi

      - name: Upload raw file (only when explicitly requested)
        if: ${{ env.STORE_RAW == 'true' && env.TARGET_URL != 'fixture' }}
        uses: actions/upload-artifact@v4
        with:
          name: raw-${{ env.TARGET_LABEL }}
          path: ${{ env.DOWNLOAD_PATH }}
          retention-days: 1
          if-no-files-found: warn
