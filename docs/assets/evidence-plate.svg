<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="416" viewBox="0 0 1200 416" role="img" aria-labelledby="title desc">
  <title id="title">Сверка с контекстом</title>
  <desc id="desc">Фрагмент синтетического примера Guardian of Truth. В каталоге есть lookup_order, но агент вызвал refund_order. Детектор вернул метку 1.</desc>
  <defs>
    <linearGradient id="paper" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop stop-color="#101f31"/>
      <stop offset="1" stop-color="#09141f"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop stop-color="#24555b" stop-opacity=".7"/>
      <stop offset="1" stop-color="#102433" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" x="610" y="78" width="22" height="22" patternUnits="userSpaceOnUse">
      <path d="M22 0H0V22" fill="none" stroke="#7bdad3" stroke-opacity=".18"/>
    </pattern>
    <pattern id="hatch" width="5" height="5" patternUnits="userSpaceOnUse">
      <path d="M0 5 5 0" stroke="#fcb599" stroke-opacity=".45"/>
    </pattern>
  </defs>

  <rect width="1200" height="416" rx="17" fill="url(#paper)"/>
  <rect x="17.5" y="17.5" width="1165" height="381" rx="9" fill="none" stroke="#385163"/>
  <path d="M18 71.5h1164M18 347.5h1164m-597 0v-276" fill="none" stroke="#385163"/>
  <path d="M18 72h212m-212 276h84" stroke="#a0e9d9" stroke-width="2"/>

  <g font-family="'DejaVu Sans Mono', monospace" font-size="14" letter-spacing="1.5" fill="#a6bdc8">
    <rect x="57" y="38" width="12" height="12" rx="2" fill="#a0e9d9"/>
    <text x="81" y="50" fill="#cae6e7">GUARDIAN OF TRUTH</text>
    <text x="1142" y="50" text-anchor="end">ПРОТОКОЛ СВЕРКИ / 01</text>
  </g>

  <g font-family="'DejaVu Sans', system-ui, sans-serif" font-weight="700" fill="#f5f8f4">
    <text x="53" y="185" font-size="83" letter-spacing="-3">Сверка</text>
    <text x="56" y="256" font-size="58" letter-spacing="-2.2">с контекстом.</text>
  </g>
  <g font-family="'DejaVu Sans Mono', monospace" font-size="16" letter-spacing="1" fill="#a5dbd5">
    <text x="60" y="309">PROMPT</text>
    <path d="M134 304h26m-5-5 5 5-5 5" fill="none" stroke="#5b8c91"/>
    <text x="178" y="309">RESPONSE</text>
    <path d="M277 304h26m-5-5 5 5-5 5" fill="none" stroke="#5b8c91"/>
    <text x="321" y="309">VERDICT</text>
  </g>

  <rect x="605" y="72" width="557" height="275" fill="url(#glow)"/>
  <rect x="610" y="94" width="532" height="230" fill="url(#grid)"/>
  <g fill="none" stroke="#5c838e" stroke-opacity=".72">
    <path d="M610 106V94h12m508 0h12v12M610 312v12h12m508 0h12v-12"/>
    <path d="M1009 96v227m-113-114h244" stroke-dasharray="2 5"/>
    <circle cx="1009" cy="209" r="108" stroke-dasharray="2 5"/>
    <circle cx="1009" cy="209" r="93"/>
  </g>

  <g fill="none" stroke-width="1.6">
    <path d="M892 163h27l38 38" stroke="#a0e9d9"/>
    <path d="M911 272h23l24-24" stroke="#fcb599"/>
  </g>
  <g fill="#96e6d7">
    <circle cx="918" cy="163" r="3"/>
    <circle cx="953" cy="197" r="3"/>
  </g>
  <g fill="#fcb599">
    <circle cx="934" cy="272" r="3"/>
    <circle cx="956" cy="250" r="3"/>
  </g>

  <g font-family="'DejaVu Sans Mono', monospace">
    <rect x="637" y="119" width="256" height="68" rx="6" fill="#0e202b" stroke="#588b8d"/>
    <path d="M647 132v42" stroke="#a0e9d9" stroke-width="2"/>
    <text x="661" y="143" font-size="13" letter-spacing="1.1" fill="#a6bdc8">[AVAILABLE TOOLS]</text>
    <text x="661" y="171" font-size="23" fill="#b0f2e2">lookup_order</text>
    <path d="m866 154 5 5 8-9" fill="none" stroke="#a0e9d9" stroke-width="2"/>

    <rect x="659" y="225" width="253" height="68" rx="6" fill="#221f29" stroke="#9d736d"/>
    <path d="M669 238v42" stroke="#fcb599" stroke-width="2"/>
    <text x="683" y="249" font-size="13" letter-spacing="1.1" fill="#c6b7bb">TOOL_CALL</text>
    <text x="683" y="277" font-size="23" fill="#ffc5a8">refund_order</text>
    <path d="m887 250 10 10m0-10-10 10" fill="none" stroke="#fcb599" stroke-width="2"/>

    <circle cx="1009" cy="209" r="74" fill="#0b1925" stroke="#5b8992"/>
    <path d="M1009 135a74 74 0 0 1 0 148" fill="none" stroke="#fcb599" stroke-width="2.5"/>
    <path d="M1009 283a74 74 0 0 1 0-148" fill="none" stroke="#a0e9d9" stroke-width="2.5"/>
    <text x="1009" y="181" text-anchor="middle" font-size="14" letter-spacing="2" fill="#b0c8ce">LABEL</text>
    <text x="1009" y="246" text-anchor="middle" font-size="66" font-weight="700" fill="#ffc5a8">1</text>
    <rect x="996" y="258" width="26" height="5" rx="1" fill="url(#hatch)"/>
  </g>

  <g font-family="'DejaVu Sans Mono', monospace" font-size="14" letter-spacing="1.2">
    <text x="58" y="379" fill="#a6bdc8">ДЕМО / СИНТЕТИЧЕСКИЙ ТРАНСКРИПТ</text>
    <path d="m879 375 5-5 5 5-5 5z" fill="#fcb599"/>
    <text x="1142" y="379" text-anchor="end" fill="#ffc5a8">HARD / TOOL_NOT_AVAILABLE</text>
  </g>
</svg>
